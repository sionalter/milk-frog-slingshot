<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f6edd7" />
    <meta name="description" content="奶娃弹射：拖拽奶娃，弹飞黑糖蛙！一个用 TypeScript + Canvas + Matter.js 制作的弹弓物理小游戏。" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>奶娃弹射 · Milk Baby Slingshot</title>
  </head>
  <body>
    <div class="rotate-hint" id="rotateHint">
      <div class="rotate-card">
        <div class="rotate-phone" aria-hidden="true"></div>
        <h2>请横屏游玩</h2>
        <p>奶娃已经架好弹弓，旋转手机就能出发。</p>
      </div>
    </div>
    <div id="app">
      <div class="stage-wrap">
        <div class="stage menu-open" id="stage">
          <canvas id="game" width="1280" height="720" aria-label="奶娃弹射游戏画面"></canvas>

          <div class="hud" id="hud">
            <div class="hud-left">
              <div class="level-chip">
                <span class="chip-dot"></span>
                <span id="levelLabel">第 1 关 · 奶香草地</span>
              </div>
              <div class="objective">
                剩余目标 <b id="enemiesLeft">0</b>
              </div>
            </div>
            <div class="hud-right">
              <div class="score-box">
                <span>SCORE</span>
                <b id="score">0</b>
              </div>
              <button class="icon-btn" id="muteBtn" type="button" aria-label="切换音效">
                <svg class="icon icon-sound" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 9.5h3.4L12 5.4v13.2L7.4 14.5H4z" fill="currentColor" />
                  <path d="M15.2 8.6a4.8 4.8 0 0 1 0 6.8M17.8 6a8.4 8.4 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
                </svg>
                <svg class="icon icon-muted hidden" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 9.5h3.4L12 5.4v13.2L7.4 14.5H4z" fill="currentColor" />
                  <path d="m15.5 9.2 5 5.6m0-5.6-5 5.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
                </svg>
              </button>
              <button class="icon-btn" id="pauseBtn" type="button" aria-label="暂停游戏">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="6.5" y="5" width="4" height="14" rx="1.6" fill="currentColor" />
                  <rect x="13.5" y="5" width="4" height="14" rx="1.6" fill="currentColor" />
                </svg>
              </button>
            </div>
          </div>

          <div class="hint-pill" id="hintPill">拖拽奶娃 · 松手发射</div>
          <div class="toast" id="toast" aria-live="polite"></div>

          <div class="overlay" id="startScreen">
            <div class="modal start-modal">
              <div class="brand">
                <div class="eyebrow">MILK BABY SLINGSHOT</div>
                <h1>奶娃弹射</h1>
                <p class="tagline">奶娃出马，黑糖蛙统统弹飞！</p>
              </div>

              <div class="mascot-wrap">
                <canvas id="mascot" width="620" height="300" aria-hidden="true"></canvas>
              </div>

              <div class="start-actions">
                <button class="btn primary big" id="startBtn" type="button">开始游戏</button>
              </div>

              <div class="level-strip" id="levelStrip"></div>
              <p class="howto">拖拽奶娃瞄准 · 松手发射 · 空中轻点释放专属技能</p>
            </div>
          </div>

          <div class="overlay hidden" id="pauseScreen">
            <div class="modal small-modal">
              <div class="eyebrow">PAUSED</div>
              <h2>歇一会儿</h2>
              <p class="modal-copy">奶娃正在弹弓上打盹。</p>
              <div class="actions vertical">
                <button class="btn primary" id="resumeBtn" type="button">继续游戏</button>
                <button class="btn ghost" id="pauseRetryBtn" type="button">重新开始</button>
                <button class="btn ghost" id="pauseHomeBtn" type="button">返回选关</button>
              </div>
            </div>
          </div>

          <div class="overlay hidden" id="resultScreen">
            <div class="modal result-modal">
              <div class="eyebrow" id="resultEyebrow">LEVEL CLEAR</div>
              <h2 id="resultTitle">关卡通过！</h2>
              <div class="stars big" id="resultStars">
                <i class="star"></i><i class="star"></i><i class="star"></i>
              </div>
              <div class="result-score">
                <span>本次得分</span>
                <b id="resultScore">0</b>
                <span class="best" id="bestScore">最佳 0</span>
              </div>
              <p class="result-note" id="resultNote"></p>
              <div class="actions">
                <button class="btn ghost" id="retryBtn" type="button">重玩</button>
                <button class="btn primary" id="nextBtn" type="button">下一关</button>
                <button class="btn ghost" id="homeBtn" type="button">选关</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
